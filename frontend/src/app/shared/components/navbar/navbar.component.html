<nav class="sticky top-0 z-50 backdrop-blur-md bg-black/40 border-b border-white/10">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-wrap items-center justify-between gap-3 min-h-16 py-2">
      <a routerLink="/" class="group flex-shrink-0 flex flex-col justify-center leading-none py-1">
        <span class="font-display font-light uppercase tracking-[0.2em] text-sm sm:text-[15px] leading-none text-white/90 group-hover:text-white transition-colors">
          Riste Gjorgjiev
        </span>
        <span class="font-display font-bold uppercase tracking-[0.44em] text-[9px] sm:text-[10px] leading-none text-white/45 group-hover:text-white/75 transition-colors mt-1.5">
          Photography
        </span>
      </a>

      <div class="flex items-center gap-1">
        <a
          routerLink="/"
          routerLinkActive="bg-white/20 text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="px-3 py-1.5 rounded-md font-mono text-xs tracking-wider text-white/60 hover:text-white hover:bg-white/10 transition-colors"
        >
          Home
        </a>
        <a
          routerLink="/explore"
          routerLinkActive="bg-white/20 text-white"
          class="px-3 py-1.5 rounded-md font-mono text-xs tracking-wider text-white/60 hover:text-white hover:bg-white/10 transition-colors"
        >
          Explore
        </a>
      </div>

      <div class="flex items-center gap-2">
        <button
          (click)="setLightingMode('NIGHT')"
          [class]="lightingMode() === 'NIGHT'
            ? 'bg-white/20 text-white'
            : 'text-white/60 hover:text-white hover:bg-white/10'"
          class="px-3 py-1.5 rounded-md font-display text-xs tracking-wider transition-colors"
        >
          BY NIGHT
        </button>
        <button
          (click)="setLightingMode('ALL')"
          [class]="lightingMode() === 'ALL'
            ? 'bg-white/20 text-white'
            : 'text-white/60 hover:text-white hover:bg-white/10'"
          class="px-3 py-1.5 rounded-md font-display text-xs tracking-wider transition-colors"
        >
          ALL WORK
        </button>
        <button
          (click)="setLightingMode('DAY')"
          [class]="lightingMode() === 'DAY'
            ? 'bg-white/20 text-white'
            : 'text-white/60 hover:text-white hover:bg-white/10'"
          class="px-3 py-1.5 rounded-md font-display text-xs tracking-wider transition-colors"
        >
          BY DAY
        </button>
      </div>

      <div class="flex items-center gap-3">
        <div class="hidden sm:flex items-center gap-2 font-mono text-[11px]">
          <span
            class="w-4 h-4 rounded-full border border-white/20"
            [style.background]="ambientPrimaryHex()"
            [title]="'Ambient primary ' + ambientPrimaryHex()"
          ></span>
          <span class="text-white/60">{{ ambientPrimaryHex() }}</span>
          <span
            class="w-4 h-4 rounded-full border border-white/20 ml-1"
            [style.background]="ambientSecondaryHex()"
            [title]="'Ambient secondary ' + ambientSecondaryHex()"
          ></span>
          <span class="text-white/60">{{ ambientSecondaryHex() }}</span>
        </div>

        <button
          (click)="toggleExifHud()"
          [class]="exifHudEnabled()
            ? 'bg-emerald-500/20 text-emerald-300 border-emerald-400/40'
            : 'bg-white/5 text-white/50 border-white/10 hover:text-white/80'"
          class="px-2.5 py-1.5 rounded-md font-mono text-[11px] tracking-wider border transition-colors"
          [title]="exifHudEnabled() ? 'EXIF HUD locked ON — click to disable' : 'EXIF HUD on hover only — click to lock ON'"
        >
          EXIF {{ exifHudEnabled() ? 'ON' : 'OFF' }}
        </button>

        <a
          routerLink="/booking"
          class="px-3 py-1.5 rounded-md font-mono text-xs tracking-wider
                 bg-gradient-to-r from-purple-600 to-blue-600 text-white
                 hover:from-purple-500 hover:to-blue-500 transition-colors"
        >
          Book Me
        </a>
      </div>
    </div>

    @if (categories().length > 0) {
      <div class="flex items-center gap-2 pb-3 overflow-x-auto">
        <button
          (click)="clearActiveCategory()"
          [class]="activeCategorySlug() === null
            ? 'bg-white/20 text-white'
            : 'text-white/60 hover:text-white hover:bg-white/10'"
          class="px-3 py-1 rounded-full text-xs font-mono transition-colors whitespace-nowrap"
        >
          ALL
        </button>
        @for (cat of categories(); track cat.id) {
          <button
            (click)="setActiveCategory(cat.slug, cat.defaultAmbientHex)"
            [class]="activeCategorySlug() === cat.slug
              ? 'bg-white/20 text-white'
              : 'text-white/60 hover:text-white hover:bg-white/10'"
            class="px-3 py-1 rounded-full text-xs font-mono transition-colors whitespace-nowrap"
          >
            {{ cat.name }}
          </button>
        }
      </div>
    }
  </div>
</nav>
