<nav class="sticky top-0 z-50 backdrop-blur-md bg-black/40 border-b border-white/10">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <div class="flex-shrink-0">
        <span class="font-mono text-sm tracking-[0.3em] uppercase text-white/80">
          Photography Portfolio
        </span>
      </div>


      <div class="flex items-center gap-2">
        <button
          (click)="setLightingMode('NIGHT')"
          [class]="
            lightingMode() === 'NIGHT'
              ? 'bg-white/20 text-white'
              : 'text-white/60 hover:text-white hover:bg-white/10'
          "
          class="px-4 py-2 rounded-md font-mono text-xs tracking-wider transition-colors"
        >
          BY NIGHT
        </button>
        <button
          (click)="setLightingMode('ALL')"
          [class]="
            lightingMode() === 'ALL'
              ? 'bg-white/20 text-white'
              : 'text-white/60 hover:text-white hover:bg-white/10'
          "
          class="px-4 py-2 rounded-md font-mono text-xs tracking-wider transition-colors"
        >
          ALL WORK
        </button>
        <button
          (click)="setLightingMode('DAY')"
          [class]="
            lightingMode() === 'DAY'
              ? 'bg-white/20 text-white'
              : 'text-white/60 hover:text-white hover:bg-white/10'
          "
          class="px-4 py-2 rounded-md font-mono text-xs tracking-wider transition-colors"
        >
          BY DAY
        </button>
      </div>


      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 font-mono text-xs">
          <div
            class="w-4 h-4 rounded-full border border-white/20"
            [style.background]="ambientPrimaryHex()"
          ></div>
          <span class="text-white/60">{{ ambientPrimaryHex() }}</span>
          <div
            class="w-4 h-4 rounded-full border border-white/20 ml-2"
            [style.background]="ambientSecondaryHex()"
          ></div>
          <span class="text-white/60">{{ ambientSecondaryHex() }}</span>
        </div>
      </div>
    </div>

    @if (categories().length > 0) {
      <div class="flex items-center gap-2 pb-3 overflow-x-auto">
        <button
          (click)="clearActiveCategory()"
          [class]="
            activeCategorySlug() === null
              ? 'bg-white/20 text-white'
              : 'text-white/60 hover:text-white hover:bg-white/10'
          "
          class="px-3 py-1 rounded-full text-xs font-mono transition-colors whitespace-nowrap"
        >
          ALL
        </button>
        @for (cat of categories(); track cat.id) {
          <button
            (click)="setActiveCategory(cat.slug, cat.defaultAmbientHex)"
            [class]="
              activeCategorySlug() === cat.slug
                ? 'bg-white/20 text-white'
                : 'text-white/60 hover:text-white hover:bg-white/10'
            "
            class="px-3 py-1 rounded-full text-xs font-mono transition-colors whitespace-nowrap"
          >
            {{ cat.name }}
          </button>
        }
      </div>
    }
  </div>
</nav>
