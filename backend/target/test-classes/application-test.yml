server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    user:
      name: admin
      password: admin123

portfolio:
  cloudinary:
    cloud-name: demo
    api-key: demo-key
    api-secret: demo-secret
  cors:
    allowed-origins: http://localhost:4200
