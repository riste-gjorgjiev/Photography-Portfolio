server:
  port: ${PORT:8080}

spring:
  application:
    name: photography-backend

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/photography_portfolio}
    username: ${DB_USERNAME:portfolio_user}
    password: ${DB_PASSWORD:portfolio_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin123}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

portfolio:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
    api-key: ${CLOUDINARY_API_KEY:demo-key}
    api-secret: ${CLOUDINARY_API_SECRET:demo-secret}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://riste-gjorgjiev.dev,https://www.riste-gjorgjiev.dev,https://photos.riste-gjorgjiev.dev}